<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reteach Sheets</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mute:#667085;--line:#dfe3ea;--brand:#2456d6;--brand-ink:#fff;--soft:#eaf0ff;--warn:#b54708;--warnbg:#fff4e5;--ok:#067647;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;color:var(--mute)}
nav button.on{background:var(--soft);color:var(--brand);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--mute);font-size:13px}
button.btn,label.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block}
button.btn:hover{background:#f2f4f7}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}button.pri:hover{background:#1c47b8}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:13px}
input[type=text],input[type=number],select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;max-width:100%}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
table{border-collapse:collapse}
table.items td,table.items th{padding:4px 6px;text-align:left}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--brand);margin-right:4px}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.notice{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.list button.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font:inherit}
.list button.item.on{border-color:var(--brand);background:var(--soft)}
/* grid */
.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:center;font-size:13px;white-space:nowrap;background:#fff}
table.grid thead th{position:sticky;top:0;background:#f2f4f7;z-index:2}
table.grid th.name,table.grid td.name{position:sticky;left:0;text-align:left;background:#fff;z-index:1;min-width:150px}
table.grid thead th.name{z-index:3;background:#f2f4f7}
table.grid td.hit{background:#ffe8e6}
table.grid input[type=checkbox]{width:18px;height:18px;cursor:pointer}
table.grid tfoot td{font-weight:600;background:#f9fafb;position:sticky;bottom:0}
/* bank */
.bankgrid{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:800px){.bankgrid{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.tcard .math{margin:6px 0}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
dialog{border:0;border-radius:14px;padding:0;width:min(860px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,25,40,.45)}
.dlg{padding:18px 20px;overflow:auto;max-height:92vh}
.field{margin-bottom:12px}.field>label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fcfcfd}
.seg-i{display:inline-flex;align-items:center;gap:2px}
.seg-i input{min-width:140px}
.seg-i math-field,.mf{min-width:120px;border:1px solid var(--brand);border-radius:6px;padding:2px 6px;font-size:18px;background:#fff}
.seg-i.math input{font-family:ui-monospace,monospace;border-color:var(--brand)}
.seg-x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px}
.preview{background:#f9fafb;border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.err{color:var(--bad);font-size:13px}
.chips button{margin:0 4px 4px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2430;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
/* printable sheets (screen look) */
.cp{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;margin-right:3px;font-weight:600;background:#eee;color:#444}
.cp.c7{background:#e3f4ea;color:#14663a}.cp.c8{background:#e6eefc;color:#1d4fb8}.cp.cA1{background:#fdf0dc;color:#9a5a00}.cp.cAA{background:#f1e6fb;color:#6a2fa3}
.dmg{border-left:4px solid var(--brand)}.dmsk{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line)}
.dmsk.off .nm{text-decoration:line-through;color:var(--mute)}.dmsk .nm{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f2f4f7;border:1px solid var(--line);border-radius:99px;padding:1px 4px 1px 9px;margin:2px 4px 2px 0;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:14px;padding:0 4px}
.dmline{margin-top:6px;font-size:11.5px;color:#333;border-top:1px dotted #999;padding-top:3px}
.dmres{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px}.dmres .r{display:flex;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line)}.dmres .r .nm{flex:1}
/* test builder */
.bq{display:flex;gap:10px;border-top:1px solid var(--line);padding:10px 0}.bn{font-weight:700;min-width:1.8em;color:var(--brand)}.bb{flex:1;min-width:0}
.bprev{background:#f9fafb;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:6px 0}.bprev .graphs svg,.bprow .graphs svg,.bprev .graphs.one svg{width:190px!important}
.bprow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.tsheet .tt{text-align:center;margin-bottom:6px}.tsheet .tt h1{font-size:18pt;margin:2px 0}.tsheet .ts{font-size:11.5pt}
.tname{display:flex;gap:18px;align-items:flex-end;margin:10px 0 8px;font-size:11.5pt}.tname i{display:inline-block;width:2.4in;border-bottom:1px solid #000;height:1em}.tname i.s{width:1in}.tname .tv{margin-left:auto;font-weight:700}
.tins{margin:4px 0;font-size:11pt}
.mc{margin:4px 0 0 .2in}.mc .ch{padding:1px 0}.mc .ch b{display:inline-block;min-width:1.5em}.mc.row4{display:flex;flex-wrap:wrap}.mc.row4 .ch{flex:1 1 24%;min-width:1.3in}.bprev .mc .ok{color:#14663a;font-weight:600}.bprev .mc .ok i{font-style:normal}
.tq{break-inside:avoid;margin-bottom:6px}.tq .q{display:flex;gap:8px}.tq .q b{min-width:1.7em}.tq .q>div{flex:1}.tpts{font-size:9.5pt;color:#555;white-space:nowrap}
#printRoot{display:none}
body[data-tab=sheets] #printRoot{display:block}
.sheet,.keysheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:.55in .6in;margin:0 auto 18px;max-width:8.5in;font-size:12pt;line-height:1.35;color:#000}
.sheet h1{font-size:19pt;margin:0}
.sheet .meta{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:12px}
.sheet .meta small{font-size:10pt;color:#444}
.item{margin-bottom:16px;break-inside:avoid}
#sheets.onePer .item+.item{break-before:page}
.prob.hasg .work{height:.7in}
.item>h3{break-after:avoid;font-size:13pt;background:#eee;padding:3px 8px;margin:0 0 6px;border-left:5px solid #000}
.tier{margin:6px 0 8px}.tl{break-after:avoid;font-size:9.5pt;text-transform:uppercase;letter-spacing:.05em;color:#444;font-weight:700;margin-bottom:2px}
.prob{break-inside:avoid;margin-bottom:6px}
.prob .q{display:flex;gap:8px}.prob .q b{min-width:1.6em}
.work{height:1.05in}.work.big{height:1.4in}
.worked.hasg{display:flex;gap:.15in;align-items:flex-start}.worked .wt{flex:1;min-width:0}.worked .graphs{margin:0;flex:0 0 auto}.worked .graphs svg{width:2.3in!important}
.sheet .meta{break-after:avoid}
.worked{border:1px solid #888;padding:6px 10px;border-radius:4px;background:#fafafa;break-inside:avoid}
.worked ol{margin:4px 0 4px 1.2em;padding:0}.worked .a{font-weight:700;margin-top:4px}
.sheet footer{margin-top:10px;font-size:9pt;color:#555;border-top:1px solid #aaa;padding-top:3px}
.keysheet h2{font-size:14pt;margin:0 0 4px}.keysheet .k{display:flex;flex-wrap:wrap;gap:4px 22px;margin-bottom:8px}.keysheet .k span{white-space:nowrap}
.graphs{display:flex;gap:.18in;flex-wrap:wrap;margin:6px 0 2px}
.graphs figure{margin:0;text-align:center;break-inside:avoid}
.graphs svg{width:3.15in;height:auto;display:block}
.graphs.one svg{width:3.4in}
.graphs figcaption{font-weight:700;font-size:10.5pt}
.tcard .graphs svg,.preview .graphs svg{width:200px}
.warnline{font-style:italic;color:#8a4b00}
@media print{
  @page{margin:.5in}
  .graphs svg{width:2.3in!important}
  .graphs.one svg{width:2.4in!important}
  body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  .sheet,.keysheet{border:0;border-radius:0;margin:0;padding:0;max-width:none;box-shadow:none}
  .sheet{break-after:page}
  .keysheet{break-inside:avoid;margin-bottom:.25in}
  body[data-print=sheets] #keys{display:none}
  body[data-print=keys] #sheets{display:none}
  body[data-only] .sheet:not(.on){display:none!important}
}
@media print{.dmline{color:#000}}
</style>
</head>
<body data-tab="tests">
<header class="top">
  <h1>Reteach Sheets</h1>
  <nav id="nav"></nav>
  <span class="grow"></span>
  <button class="btn sm" data-act="exportAll">Back up everything</button>
  <button class="btn sm" data-act="importAll">Restore backup</button>
</header>
<main id="app"></main>
<div id="printRoot"><div id="sheets"></div><div id="keys"></div></div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="engine.js"></script>
<script src="sheets.js"></script>
<script src="builder/choices.js"></script>
<script src="builder/builder.js"></script>
<script src="builder/export.js"></script>
<script src="builder/pdfeach.js"></script>
<script src="graphs.js"></script>
<script src="deltamath/skills.js"></script>
<script src="deltamath/map.js"></script>
<script src="deltamath/dm.js"></script>
<script src="bank/dsl.js"></script>
<!-- Question bank files. To add your own, copy one of these, edit it, and add a line here. -->
<script src="bank/equations.js"></script>
<script src="bank/linear.js"></script>
<script src="bank/systems.js"></script>
<script src="bank/polynomials.js"></script>
<script src="bank/factoring.js"></script>
<script src="bank/other.js"></script>
<script src="bank/quadratics.js"></script>
<script src="bank/quadratics_graphs.js"></script>
<script src="bank/advanced.js"></script>
<script src="bank/adv_graphs.js"></script>
<script src="bank/adv_exp.js"></script>
<script src="bank/adv_rational.js"></script>
<script src="bank/adv_matrices.js"></script>
<script src="bank/adv_trig.js"></script>
<script src="bank/adv_stats.js"></script>
<script>
(function(){
'use strict';
const E = ReteachEngine, S = ReteachSheets, DM = ReteachDM;
const LS_KEY = 'reteach.v1';
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3);
const clone = (o) => JSON.parse(JSON.stringify(o));
const TIER_NAME = { worked:'Worked example', easier:'Warm-up (easier)', parallel:'Try it (like the test)', challenge:'Challenge' };

/* ---------------- state ---------------- */
let state = defaults(), shared = { skills: [], templates: [] }, storageOK = true;
function defaults(){ return { tests: [], builds: [], bank: { custom: [], hidden: [], over: {}, skills: [] }, counts: { worked:1, easier:1, parallel:2, challenge:0 }, dm: { map: {} }, ui: { tab:'tests', testId:null, classId:null, bankSkill:null, tierFilter:'all', showHidden:false } }; }
function load(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(defaults(), JSON.parse(raw)); } catch(e){ storageOK = false; } }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){ storageOK = false; } }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
function download(name, obj){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* ---------------- bank assembly ---------------- */
const allSkills = () => RB.skills.concat(shared.skills, state.bank.skills);
function allTemplatesRaw(){
  const stock = RB.templates.map((t) => state.bank.over[t.id] ? Object.assign({}, state.bank.over[t.id], { overridden:true }) : t);
  return stock.concat(shared.templates.map((t) => Object.assign({ shared:true }, t)), state.bank.custom.map((t) => Object.assign({ custom:true }, t)));
}
const allTemplates = () => allTemplatesRaw().filter((t) => !state.bank.hidden.includes(t.id));
const findTpl = (id) => allTemplatesRaw().find((t) => t.id === id);
const units = () => { const u = []; allSkills().forEach((s) => { if (!u.includes(s.unit)) u.push(s.unit); }); return u; };
const skillName = (id) => { const s = allSkills().find((k) => k.id === id); return s ? s.name : '(removed skill)'; };
function skillOptions(sel){
  let h = '<option value="">— choose a skill —</option>';
  units().forEach((u) => { h += '<optgroup label="' + esc(u) + '">' + allSkills().filter((s) => s.unit === u).map((s) => '<option value="' + esc(s.id) + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</optgroup>'; });
  return h;
}

/* ---------------- rendering math ---------------- */
function kx(s, display){ try { return katex.renderToString(s, { throwOnError:false, displayMode:!!display, strict:'ignore' }); } catch(e){ return '<code>' + esc(s) + '</code>'; } }
const fmtText = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const graphsHTML = (gs) => gs && gs.length ? '<div class="graphs' + (gs.length === 1 ? ' one' : '') + '">' + gs.map((g) => '<figure>' + ReteachGraphs.svg(g) + (g.label ? '<figcaption>' + esc(g.label) + '</figcaption>' : '') + '</figure>').join('') + '</div>' : '';
const rich = (str) => E.splitMath(str).map((g) => g.type === 'math' ? kx(g.s) : fmtText(g.s)).join('');

/* ---------------- current objects ---------------- */
const curTest = () => state.tests.find((t) => t.id === state.ui.testId) || null;
const curClass = () => { const t = curTest(); return t ? (t.classes || []).find((c) => c.id === state.ui.classId) || null : null; };
function ensureSelection(){
  if (!state.tests.find((t) => t.id === state.ui.testId)) state.ui.testId = state.tests[0] ? state.tests[0].id : null;
  const t = curTest();
  if (t && !(t.classes || []).find((c) => c.id === state.ui.classId)) state.ui.classId = t.classes && t.classes[0] ? t.classes[0].id : null;
}

/* ---------------- tabs ---------------- */
const TABS = [['tests','1 · Tests'],['grid','2 · Mark misses'],['sheets','3 · Print sheets'],['dm','4 · DeltaMath'],['build','Test builder'],['bank','Question bank']];
function render(){
  try { renderInner(); } catch (e) {
    console.error(e);
    $('#app').innerHTML = '<div class="card"><h2>Something went wrong</h2><p class="err">' + esc(e && e.message || e) + '</p><p class="muted">' + esc(health()) + '</p><button class="btn" data-act="tab" data-k="tests">Back to Tests</button></div>';
  }
}
function health(){
  const miss = [];
  if (typeof katex === 'undefined') miss.push('vendor/katex/katex.min.js');
  if (typeof ReteachDM === 'undefined' || typeof DMINV === 'undefined') miss.push('the deltamath/ folder');
  if (typeof RB === 'undefined' || !RB.skills.length) miss.push('the bank/ folder (no questions loaded)');
  return miss.length ? 'These files did not load from your site: ' + miss.join(', ') + '. Re-upload the whole folder, keeping the subfolders.' : '';
}
function renderInner(){
  ensureSelection();
  document.body.dataset.tab = state.ui.tab;
  $('#nav').innerHTML = TABS.map(([k, n]) => '<button data-act="tab" data-k="' + k + '" class="' + (state.ui.tab === k ? 'on' : '') + '">' + n + '</button>').join('');
  const v = { tests:viewTests, grid:viewGrid, sheets:viewSheets, dm:viewDM, build:viewBuild, bank:viewBank }[state.ui.tab];
  $('#app').innerHTML = (storageOK ? '' : '<div class="notice">This browser is blocking saved data, so nothing will be kept after you close the page. Use “Back up everything” before you leave.</div>') + v();
  if (state.ui.tab === 'sheets') buildSheets(); else if (state.ui.tab === 'build') buildBuildPrint(); else { $('#sheets').innerHTML = ''; $('#keys').innerHTML = ''; }
  if (state.ui.tab === 'dm' && state.ui.dmView === 'inv') updateInvResults();
}
function testPicker(){
  if (!state.tests.length) return '';
  return '<select data-ch="pickTest">' + state.tests.map((t) => '<option value="' + t.id + '"' + (t.id === state.ui.testId ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</select>';
}
function classPicker(){
  const t = curTest(); if (!t) return '';
  return '<select data-ch="pickClass">' + (t.classes || []).map((c) => '<option value="' + c.id + '"' + (c.id === state.ui.classId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select> <button class="btn sm" data-act="newClass">+ Class</button>';
}

/* ---------------- view: tests ---------------- */
function viewTests(){
  const t = curTest();
  let h = '<div class="card"><div class="row"><h2 class="grow">Your tests</h2><button class="btn pri" data-act="newTest">+ New test</button><button class="btn" data-act="importTest">Import a shared test</button></div>';
  h += state.tests.length ? '<div class="row">' + testPicker() + (t ? '<button class="btn" data-act="exportTest">Export (no student names)</button><button class="btn danger" data-act="delTest">Delete test</button>' : '') + '</div>'
     : '<p class="muted">Make a test, then tell the tool which skill each question item checks. That is the only setup. Colleagues can import the same test file so everyone uses common assessments.</p>';
  h += '</div>';
  if (t) {
    const missing = t.items.filter((i) => !i.skill && !(i.dm && i.dm.length)).length;
    h += '<div class="card"><div class="row"><label><b>Test name</b> <input type="text" data-ch="testName" value="' + esc(t.name) + '" size="32"></label>';
    h += '<span class="grow"></span><label>Add <input type="number" id="addN" min="1" max="60" value="5" style="width:64px"> more items</label><button class="btn" data-act="addItems">Add</button></div>';
    if (missing) h += '<p class="notice" style="margin-top:10px">' + missing + ' item(s) still need a skill. Students who miss them will get a note instead of practice problems.</p>';
    h += '<table class="items" style="margin-top:8px"><thead><tr><th>Item #</th><th>Skill it tests</th><th>DeltaMath skills</th><th></th></tr></thead><tbody>';
    t.items.forEach((it, i) => { h += '<tr><td><input type="text" size="5" data-ch="itemN" data-i="' + i + '" value="' + esc(it.n) + '"></td><td><select data-ch="itemSkill" data-i="' + i + '">' + skillOptions(it.skill) + '</select></td><td>' + itemDmCell(it, i) + '</td><td><button class="btn sm danger" data-act="delItem" data-i="' + i + '">✕</button></td></tr>'; });
    h += '</tbody></table><p class="muted">Item numbers can be anything you write on the paper test, like 7 or 12b. An item can use a bank skill, DeltaMath skills only, or both.</p></div>';
  }
  return h;
}

/* ---------------- view: grid ---------------- */
function viewGrid(){
  const t = curTest();
  if (!t) return '<div class="card">Create a test first (tab 1).</div>';
  let h = '<div class="card"><div class="row"><h2>' + esc(t.name) + '</h2>' + testPicker() + classPicker() + '</div>';
  h += '<p class="muted">Student names stay in this browser only. They are never uploaded anywhere, and test exports leave them out.</p>';
  const c = curClass();
  if (!c) return h + '<p>Add a class (for example “Period 3”) to start.</p></div>';
  h += '<div class="row"><button class="btn" data-act="pasteNames">Paste a roster</button><button class="btn" data-act="addStudent">+ Student</button><button class="btn" data-act="renameClass">Rename class</button><button class="btn danger" data-act="delClass">Delete class</button></div></div>';
  h += '<div class="card"><p class="muted" style="margin-top:0">Look at each paper test and tick the items that student <b>missed</b>.</p><div id="gridbox">' + gridHTML(t, c) + '</div></div>';
  return h;
}
function gridHTML(t, c){
  if (!c.roster.length) return '<p>No students yet — use “Paste a roster”.</p>';
  let h = '<div class="gridwrap"><table class="grid"><thead><tr><th class="name">Student</th>';

    h += '<div class="tcard" style="' + (hidden ? 'opacity:.5' : '') + '"><div class="row"><span class="pill">' + TIER_NAME[t.tier] + '</span>' + (t.custom ? '<span class="pill">mine</span>' : '') + (t.shared ? '<span class="pill">shared</span>' : '') + (t.overridden ? '<span class="pill warn">edited</span>' : '') + '<span class="grow"></span>';
    h += '<button class="btn sm" data-act="reroll" data-id="' + esc(t.id) + '">New numbers</button>';
    if (!t.shared) h += '<button class="btn sm" data-act="editTpl" data-id="' + esc(t.id) + '">Edit</button>';
    if (t.overridden) h += '<button class="btn sm" data-act="resetTpl" data-id="' + esc(t.id) + '">Reset to stock</button>';

    else h += '<button class="btn sm" data-act="hideTpl" data-id="' + esc(t.id) + '">' + (hidden ? 'Unhide' : 'Hide') + '</button>';
    h += '</div>' + body + '</div>';
  });
  if (!list.length) h += '<div class="card muted">Nothing here yet.</div>';
  return h + '</div></div>';
}

/* ---------------- math keyboard editor ---------------- */
let MATHLIVE = false;
const simpleTok = /\{\{\s*([A-Za-z_]\w*)(?::(\w+))?\s*\}\}/g;
const toTemplate = (latex) => latex.replace(/\\(?:text|mathrm)\{@([A-Za-z_]\w*)(?::(\w+))?\}/g, (m, v, md) => '{{' + v + (md ? ':' + md : '') + '}}');
const fromTemplate = (s) => s.replace(simpleTok, (m, v, md) => '\\text{@' + v + (md && md !== 'plain' ? ':' + md : '') + '}');
const needsRaw = (s) => /\{\{/.test(s.replace(simpleTok, ''));
let ed = null;

function mkMathField(val){
  if (MATHLIVE) {
    const f = document.createElement('math-field');
    f.setAttribute('math-virtual-keyboard-policy', 'auto');
    f.value = val || '';
    return { el:f, get:() => f.value, insertVar:(n, m) => f.insert('\\text{@' + n + (m ? ':' + m : '') + '}'), onchange:(fn) => f.addEventListener('input', fn), focus:(fn) => f.addEventListener('focus', fn) };
  }
  const i = document.createElement('input'); i.type = 'text'; i.value = val || ''; i.placeholder = 'LaTeX, e.g. 3x+5=20';
  return { el:i, get:() => i.value, insertVar:(n, m) => insertAt(i, '\\text{@' + n + (m ? ':' + m : '') + '}'), onchange:(fn) => i.addEventListener('input', fn), focus:(fn) => i.addEventListener('focus', fn) };
}
function insertAt(el, s){ const a = el.selectionStart == null ? el.value.length : el.selectionStart, b = el.selectionEnd == null ? a : el.selectionEnd; el.value = el.value.slice(0, a) + s + el.value.slice(b); el.focus(); el.setSelectionRange(a + s.length, a + s.length); el.dispatchEvent(new Event('input')); }

// Mixed text + math line, built from pieces
function segField(init, onChange){
  const root = document.createElement('div'); root.className = 'seg';
  const parts = [];
  const api = { el:root, get:() => parts.map((p) => p.type === 'math' ? '$' + toTemplate(p.f.get()).trim() + '$' : p.f.get().replace(/\$/g, '\\$')).join(''), insertVar:(n, m) => { const l = ed.last; if (l) l.insertVar(n, m); else if (parts[0]) parts[0].f.insertVar(n, m); } };
  const bar = document.createElement('span'); bar.innerHTML = '<button type="button" class="btn sm" data-add="text">+ words</button> <button type="button" class="btn sm" data-add="math">+ math</button>';
  function add(type, val){
    const w = document.createElement('span'); w.className = 'seg-i ' + type;
    let f;
    if (type === 'math') f = mkMathField(fromTemplate(val));
    else { const i = document.createElement('input'); i.type = 'text'; i.value = val; i.size = Math.max(8, Math.min(40, val.length + 2)); f = { el:i, get:() => i.value, insertVar:(n, m) => insertAt(i, '{{' + n + (m ? ':' + m : '') + '}}'), onchange:(fn) => i.addEventListener('input', fn), focus:(fn) => i.addEventListener('focus', fn) }; }
    f.onchange(onChange); f.focus(() => { ed.last = f; });
    const x = document.createElement('button'); x.type = 'button'; x.className = 'seg-x'; x.textContent = '✕';
    const rec = { type, f, w };
    x.onclick = () => { parts.splice(parts.indexOf(rec), 1); w.remove(); onChange(); };
    w.append(f.el, x); parts.push(rec); root.insertBefore(w, bar);
  }
  bar.onclick = (e) => { const t = e.target.dataset.add; if (t) { add(t, ''); parts[parts.length - 1].f.el.focus(); onChange(); } };
  root.appendChild(bar);
  const segs = E.splitMath(init || '');
  if (!segs.length) add('text', '');
  segs.forEach((g) => add(g.type, g.s));
  return api;
}
function rawField(init, multi, onChange){
  const el = document.createElement(multi ? 'textarea' : 'input'); if (multi) el.rows = 3; else el.type = 'text'; el.style.width = '100%'; el.value = init || '';
  el.addEventListener('input', onChange);
  const api = { el, get:() => el.value, insertVar:(n, m) => insertAt(el, '{{' + n + (m ? ':' + m : '') + '}}') };
  el.addEventListener('focus', () => { ed.last = api; });
  return api;
}
function answerField(init, onChange){
  if (ed.raw) return rawField(init, false, onChange);
  const f = mkMathField(fromTemplate(init || ''));
  f.onchange(onChange); f.focus(() => { ed.last = f; });
  return { el:f.el, get:() => toTemplate(f.get()).trim(), insertVar:f.insertVar };
}
const linesOf = (o) => Object.keys(o || {}).map((k) => k + ' = ' + o[k]).join('\n');

function openEditor(id, presetSkill){
  const ex = id ? findTpl(id) : null;
  const t = ex ? clone(ex) : { skill:presetSkill, tier:'parallel', prompt:'', answer:'', steps:[], params:{}, derived:{}, constraints:[] };
  const strings = [t.prompt, t.answer].concat(t.steps || []);
  ed = { last:null, id:ex ? ex.id : null, stock:ex && !ex.custom, t, raw: !MATHLIVE || strings.some(needsRaw), random: !!Object.keys(t.params || {}).length, last:null, fields:{}, text:{ params:linesOf(t.params), derived:linesOf(t.derived), cons:(t.constraints || []).join('\n') } };

}
function snapshot(){ // keep what the user typed when the editor redraws
  const f = ed.fields; if (!f.prompt) return;
  ed.t.prompt = f.prompt.get(); ed.t.answer = f.answer.get(); ed.t.steps = f.steps.map((x) => x.get()).filter((s) => s.trim());

}
function drawEditor(){

    (ed.stock ? '<p class="muted">You are editing a stock question. Your version replaces it; “Reset to stock” brings the original back.</p>' : '') +
    '<div class="row"><div class="field"><label>Skill</label><select id="e-skill">' + skillOptions(t.skill) + '</select></div><div class="field"><label>Kind</label><select id="e-tier">' + E.TIERS.map((x) => '<option value="' + x + '"' + (t.tier === x ? ' selected' : '') + '>' + TIER_NAME[x] + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Numbers</label><select id="e-random"><option value="0"' + (!ed.random ? ' selected' : '') + '>Same every time</option><option value="1"' + (ed.random ? ' selected' : '') + '>New numbers for each student</option></select></div>' +
    '<div class="field"><label>Entry</label><select id="e-raw"><option value="0"' + (!ed.raw ? ' selected' : '') + (MATHLIVE ? '' : ' disabled') + '>Math keyboard</option><option value="1"' + (ed.raw ? ' selected' : '') + '>Type LaTeX / text</option></select></div></div>' +
    (MATHLIVE ? '' : '<p class="muted">The math keyboard could not load (no internet?). You can type LaTeX instead.</p>') +
    '<div class="field"><label>Question — mix words and math</label><div id="e-prompt"></div></div>' +
    '<div class="field"><label>Answer (math only)</label><div id="e-answer"></div></div>' +

    (ed.random ? '<div class="card" style="background:#fafbff"><h3>How the numbers are chosen</h3>' +
      '<div class="field"><label>Numbers <span class="muted">one per line: <code>a = -9..9 !0</code> (range, leaving out 0) or <code>b = 2,3,5</code></span></label><textarea id="e-params" rows="3">' + esc(ed.text.params) + '</textarea></div>' +
      '<div class="field"><label>Calculated <span class="muted">answers worked out from the numbers: <code>c = a*x</code>. Can use + − * / ^ gcd abs min max sqrt</span></label><textarea id="e-derived" rows="2">' + esc(ed.text.derived) + '</textarea></div>' +
      '<div class="field"><label>Rules <span class="muted">one per line; the numbers are re-picked until all are true: <code>a != b</code></span></label><textarea id="e-cons" rows="2">' + esc(ed.text.cons) + '</textarea></div>' +
      '<div class="field chips"><label>Put a number into the question</label><div id="e-chips"></div><div class="muted">Click a name to insert it where your cursor is. “How to show it” controls signs: <i>with + / −</i> turns 5 into “+ 5” and −5 into “− 5”, <i>coefficient</i> hides a 1, <i>parentheses</i> wraps negatives.</div></div></div>' : '') +
    '<div class="field"><label>Preview</label><div class="preview" id="e-prev"></div></div><div class="row"><span class="grow err" id="e-err"></span>' + (ed.random ? '<button class="btn" data-ed="reroll">New numbers</button>' : '') + '<button class="btn" data-ed="close">Cancel</button><button class="btn pri" data-ed="save">Save question</button></div></div>';
  const upd = debounce(refreshPreview, 250);
  ed.upd = upd;
  ed.fields = {
    prompt: ed.raw ? rawField(t.prompt, true, upd) : segField(t.prompt, upd),
    answer: answerField(t.answer, upd),
    steps: []
  };
  $('#e-prompt').appendChild(ed.fields.prompt.el); $('#e-answer').appendChild(ed.fields.answer.el);
  (t.steps || []).forEach((s) => addStep(s));
  if (!(t.steps || []).length) $('#e-stepswrap').dataset.empty = '1';
  ['e-skill','e-tier'].forEach((k) => $('#' + k).addEventListener('change', upd));
  $('#e-random').onchange = () => { snapshot(); ed.random = $('#e-random').value === '1'; drawEditor(); };
  $('#e-raw').onchange = () => { snapshot(); ed.raw = $('#e-raw').value === '1'; drawEditor(); };
  ['e-params','e-derived','e-cons'].forEach((k) => { const el = $('#' + k); if (el) el.addEventListener('input', () => { drawChips(); upd(); }); });

function addStep(val){
  const wrap = document.createElement('div'); wrap.style.marginBottom = '6px';
  const f = ed.raw ? rawField(val, false, ed.upd) : segField(val, ed.upd);
  const x = document.createElement('button'); x.type = 'button'; x.className = 'seg-x'; x.textContent = 'remove step';
  x.onclick = () => { ed.fields.steps.splice(ed.fields.steps.indexOf(f), 1); wrap.remove(); ed.upd(); };
  wrap.append(f.el, x); $('#e-steps').appendChild(wrap); ed.fields.steps.push(f);
}
function varNames(){
  const out = [];
  [$('#e-params'), $('#e-derived')].forEach((el) => { if (el) el.value.split('\n').forEach((l) => { const m = l.match(/^\s*([A-Za-z_]\w*)\s*=/); if (m && !out.includes(m[1])) out.push(m[1]); }); });

}
function drawChips(){

function currentTemplate(){

const debounce = (fn, ms) => { let h; return () => { clearTimeout(h); h = setTimeout(fn, ms); }; };

/* ---------------- file import/export ---------------- */
let importKind = null;
function pickFile(kind){ importKind = kind; $('#file').value = ''; $('#file').click(); }
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch (err) { return toast('That file is not a valid export.'); }
  try {
    if (importKind === 'all') { if (!data.tests || !data.bank) throw 0; if (!confirm('Replace everything in this browser with the backup?')) return; state = Object.assign(defaults(), data); toast('Backup restored'); }
    else if (importKind === 'test') { if (data.type !== 'reteach-test') throw 0; const t = data.test; t.id = uid(); t.classes = []; t.setCode = t.setCode || uid().slice(0, 4).toUpperCase(); state.tests.push(t); state.ui.testId = t.id; toast('Test imported'); }
    else if (importKind === 'dm') { if (data.type !== 'reteach-dm') throw 0; Object.assign(state.dm.map, data.map || {}); toast('DeltaMath mapping imported'); }
    else if (importKind === 'bank') {
      if (data.type !== 'reteach-bank') throw 0;
      const have = new Set(allSkills().map((s) => s.id));
      (data.skills || []).forEach((s) => { if (!have.has(s.id)) state.bank.skills.push(s); });
      (data.templates || []).forEach((t) => { delete t.custom; delete t.shared; state.bank.custom.push(Object.assign(t, { id:'c-' + uid() })); });
      toast((data.templates || []).length + ' question(s) imported');
    }
  } catch (err) { return toast('That file is not the right kind of export.'); }
  save(); render();
});

function rasterize(g){
  return new Promise((res, rej) => {
    const svg = ReteachGraphs.svg(g).replace('<svg ', '<svg width="720" height="720" '), img = new Image(), cap = g.label ? 70 : 0;
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = 720; c.height = 720 + cap; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, 720, 720);
      if (cap) { x.fillStyle = '#000'; x.font = 'bold 40px Helvetica,Arial,sans-serif'; x.textAlign = 'center'; x.fillText(g.label, 360, 720 + 48); }
      c.toBlob((bl) => bl.arrayBuffer().then((ab) => res({ bytes:new Uint8Array(ab), w:c.width, h:c.height })), 'image/png');
    };
    img.onerror = () => rej(new Error('Could not draw a graph')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function retestJson(b){ return JSON.stringify({ type:'reteach-test', test:{ id:uid(), name:b.name, setCode:uid().slice(0, 4).toUpperCase(), items:b.slots.map((s, i) => ({ n:String(i + 1), skill:s.skill })), classes:[] } }, null, 2); }
function openExport(){
  const o = Object.assign({ word:true, latex:true, retest:true, key:true }, state.ui.exp || {});
  const c = (k, t, sub) => '<label style="display:block;margin:6px 0"><input type="checkbox" data-ex="' + k + '"' + (o[k] ? ' checked' : '') + '> <b>' + t + '</b><br><span class="muted" style="margin-left:22px">' + sub + '</span></label>';
  $('#dlg').innerHTML = '<div class="dlg" style="width:min(560px,94vw)"><h2 style="margin-top:0">Export “' + esc(curBuild().name) + '”</h2>' +
    c('word', 'Word (.docx)', 'Editable equations (Insert ▸ Equation), graphs as pictures. One file per version.') + c('latex', 'LaTeX (exam class)', '.tex files with answer spaces and a grading sheet at the back; graphs in a figures folder.') + c('retest', 'Reteach test file', 'Load it on tab 1 (Import) to mark misses and print practice sheets.') + c('key', 'Include answer keys', 'A separate key file for each version in Word and LaTeX.') +
    '<div class="row" style="margin-top:12px"><button class="btn pri" data-bx="go">Download .zip</button><button class="btn" data-bx="close">Close</button><span class="muted" id="bxMsg"></span></div><p class="muted">For a PDF, use “Print test / save as PDF” instead.</p></div>';
  const d = $('#dlg'); if (!d.open) d.showModal();
}
document.addEventListener('click', async (e) => {
  const x = e.target.closest('[data-bx]'); if (!x) return;
  if (x.dataset.bx === 'close') { $('#dlg').close(); return; }
  const b = curBuild(), o = Object.assign({ word:true, latex:true, retest:true, key:true }, state.ui.exp || {}), msg = $('#bxMsg');
  if (!(o.word || o.latex || o.retest)) { msg.textContent = 'Tick at least one format.'; return; }
  try {
    msg.textContent = 'Building…'; const doc = buildDoc(b), imgs = {};
    if (o.word || o.latex) for (const v of doc.versions) for (const q of v.questions) for (let gi = 0; gi < (q.graphs || []).length; gi++) imgs[XP.imgKey(v, q, gi)] = await rasterize(q.graphs[gi]);
    const warns = []; const bytes = XP.exportAll(doc, imgs, o, retestJson(b), (m) => warns.push(m));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type:'application/zip' })); a.download = XP.safe(b.name) + '.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    msg.textContent = 'Downloaded.' + (warns.length ? ' (Some symbols may need a look in Word.)' : '');
  } catch (err) { msg.textContent = 'Export failed: ' + (err && err.message || err); }
});
Object.assign(A, {
  newBuild(){ const n = prompt('Name of the test (for example “Unit 4 Test”):'); if (!n) return; state.builds = state.builds || []; const b = newBuildObj(n.trim()); state.builds.push(b); state.ui.buildId = b.id; save(); render(); },
  dupBuild(){ const b = clone(curBuild()); b.id = uid(); b.name += ' (copy)'; b.slots.forEach((s) => { s.id = uid(); }); state.builds.push(b); state.ui.buildId = b.id; save(); render(); },
  delBuild(){ if (!confirm('Delete this test?')) return; state.builds = state.builds.filter((b) => b.id !== state.ui.buildId); state.ui.buildId = null; save(); render(); },
  bNewNumbers(){ curBuild().seed = uid().slice(0, 4).toUpperCase(); curBuild().slots.forEach((s) => { s.reroll = 0; }); save(); render(); },
  bPicker(){ openBP(); },
  bAddSkill(){ const v = $('#bSkill').value; if (!v) return toast('Choose a skill first'); addSlot(curBuild(), { skill:v }); save(); render(); },
  bFromTest(){ const t = state.tests.find((x) => x.id === $('#bTest').value); if (!t) return; t.items.filter((i) => i.skill).forEach((i) => addSlot(curBuild(), { skill:i.skill })); save(); render(); },
  bUp(b){ const s = curBuild().slots, i = +b.dataset.i; [s[i - 1], s[i]] = [s[i], s[i - 1]]; save(); render(); },
  bDown(b){ const s = curBuild().slots, i = +b.dataset.i; [s[i + 1], s[i]] = [s[i], s[i + 1]]; save(); render(); },
  bDel(b){ curBuild().slots.splice(+b.dataset.i, 1); save(); render(); },
  bReroll(b){ const s = curBuild().slots[+b.dataset.i]; s.reroll = (s.reroll || 0) + 1; save(); render(); },
  bAllType(b){ const t = b.dataset.t; curBuild().slots.forEach((s) => { s.type = t; if (t === 'mc' && s.pts === 4) s.pts = 2; if (t === 'free' && s.pts === 2) s.pts = 4; delete s.space; }); save(); render(); },
  bNewChoices(b){ const s = curBuild().slots[+b.dataset.i]; s.mcRe = (s.mcRe || 0) + 1; save(); render(); },
  bUnpin(b){ const s = curBuild().slots[+b.dataset.i]; delete s.tplId; if (!s.tiers.length) s.tiers = ['parallel']; save(); render(); },
  bExport(){ openExport(); },
  bMakeRetest(){ const b = curBuild(), t = { id:uid(), name:b.name, setCode:uid().slice(0, 4).toUpperCase(), items:b.slots.map((s, i) => ({ n:String(i + 1), skill:s.skill })), classes:[] }; state.tests.push(t); state.ui.testId = t.id; save(); toast('Reteach test “' + b.name + '” created — find it on tab 1'); render(); }
});
Object.assign(C, {
  pickBuild(el){ state.ui.buildId = el.value; },
  bver(el){ state.ui.bver = +el.value; },
  bField(el){ const b = curBuild(), f = el.dataset.f; b[f] = el.type === 'checkbox' ? el.checked : el.dataset.num ? +el.value : (f === 'name' && !el.value.trim() ? b[f] : el.value); },
  bTier(el){ const s = curBuild().slots[+el.dataset.i], t = el.dataset.t, k = s.tiers.indexOf(t); if (el.checked && k < 0) s.tiers.push(t); if (!el.checked && k >= 0 && s.tiers.length > 1) s.tiers.splice(k, 1); },
  bSlot(el){ const s = curBuild().slots[+el.dataset.i]; if (el.dataset.f === 'type') { s.type = el.value; delete s.space; if (el.value === 'mc' && s.pts === 4) s.pts = 2; if (el.value === 'free' && s.pts === 2) s.pts = 4; return; } const v = parseFloat(el.value); if (isNaN(v) || v < 0) return; s[el.dataset.f] = v; }
});

/* ---------------- start ---------------- */
function boot(){
  load(); render();
  const hm = health(); if (hm) $('#app').insertAdjacentHTML('afterbegin', '<div class="notice">' + esc(hm) + '</div>');
  fetch('shared-bank.json').then((r) => r.ok ? r.json() : null).then((d) => { if (d && d.templates) { shared = { skills:d.skills || [], templates:(d.templates || []).map((t, i) => Object.assign({ id:'sh-' + i }, t)) }; render(); } }).catch(() => {});
  // Math keyboard (MathLive). Tries a local copy first, then the CDN. The app works without it.
  const tryLoad = (src) => import(src);
  tryLoad('./vendor/mathlive/mathlive.min.js').catch(() => tryLoad('https://cdn.jsdelivr.net/npm/mathlive@0.101.0/+esm')).then(() => customElements.whenDefined('math-field')).then(() => { MATHLIVE = true; }).catch(() => { MATHLIVE = false; });
}
boot();
})();
